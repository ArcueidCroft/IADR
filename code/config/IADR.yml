model: models_IADR.py:IADR
version: IADR
bounds: [[0., 1.], [0., 1.]]
N: 256
check_val_every_n_epoch: 5
kernel_size: 17
kernel_init: zeros
layers: [8, 3]
activation: GaussActivation
lr: 1e-4
seed: 0
max_epochs: 20000

# 
hyper_hidden_dim: 256      # MLP hidden width (DR1 has few weights, 256 is enough)
hyper_n_layers: 3          # MLP hidden depth
norm_factor: 2.0           # signed_sigmoid factor controlling the range of emitted weights

# epsilon normalisation range (set to match the working interval E)
eps_min: 0.0065
eps_max: 0.0090

# data
train_u: train_datasets/train_std/train_dataset_5.npy
train_eps: train_datasets/train_std/train_dataset_eps_5.npy
valid_u: train_datasets/train_std/valid_dataset_5.npy
valid_eps: train_datasets/train_std/valid_dataset_eps_5.npy
